# BURN IN, Version 2.0 — book manifest
# Markdown files in manuscript/ are the source of truth. This file declares
# order, structure, titles, and per-file word-count targets used by
# scripts/build-book.mjs, scripts/validate.mjs, and scripts/word-count.mjs.

